name: Windows PDF parity
on:
  push:
    branches: [main]
    paths: ['crates/**', 'native/pdf-render/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/pdf-windows.yml']
  pull_request:
    paths: ['crates/**', 'native/pdf-render/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/pdf-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Windows build tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            tar gzip curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
      - name: Fingerprint toolchain
        id: toolchain
        shell: msys2 {0}
        run: echo "fingerprint=$(pacman -Q | LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Reuse exact PDF pack
        id: pdf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: Artifacts/PDFPack-Windows
          key: pdf-ucrt64-v1-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('crates/fileform-engine/tools/build-pdf-windows.sh') }}
      - name: Build source-verified PDF pack
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash crates/fileform-engine/tools/build-pdf-windows.sh
      - name: Build native CLI and worker
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          $env:RUSTFLAGS='-C target-feature=+crt-static'
          cargo build --release --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real Windows PDF inspection
        shell: pwsh
        env:
          FILEFORM_NATIVE_DIAGNOSTICS: '1'
        run: |
          python crates/fileform-engine/tests/smoke-pdf.py Artifacts/PDFPack-Windows | Tee-Object -FilePath Artifacts/pdf-smoke-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PDFium evaluation dependency
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force Artifacts/pdfium-evaluation | Out-Null
          $archive = 'Artifacts/pdfium-evaluation/pdfium-win-x64.tgz'
          Invoke-WebRequest 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8066/pdfium-win-x64.tgz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '739a57d597d864297909cc40a2411eba728490c76a0fa25e3ea299c7f6b07020') { throw 'PDFium archive hash mismatch' }
          gh attestation verify $archive --repo bblanchon/pdfium-binaries --format json > Artifacts/pdfium-evaluation/attestation-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xzf $archive -C Artifacts/pdfium-evaluation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build OCR dependency for scanned PDF verification
        shell: pwsh
        run: |
          python Tools/build-ocr-evaluation.py --work Artifacts/pdf-ocr-evaluation --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise Windows PDF rendering helper
        shell: pwsh
        run: |
          $pdfium = (Resolve-Path Artifacts/pdfium-evaluation).Path
          cmake -S native/pdf-render -B Artifacts/pdfium-evaluation/build -A x64 "-DPDFIUM_ROOT=$pdfium"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build Artifacts/pdfium-evaluation/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-render.py Artifacts/pdfium-evaluation/build/Release/fileform-pdf-render.exe Artifacts/PDFPack-Windows/bin/qpdf.exe | Tee-Object -FilePath Artifacts/pdf-render-smoke-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/pdf-render/stage-evaluation.py Artifacts/pdfium-evaluation/build/Release Artifacts/pdfium-evaluation Artifacts/PDFRenderPack-Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-render-engine.py Artifacts/PDFRenderPack-Windows | Tee-Object -FilePath Artifacts/pdf-render-engine-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-optimize.py Artifacts/PDFPack-Windows Artifacts/PDFRenderPack-Windows | Tee-Object -FilePath Artifacts/pdf-optimize-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-compose.py Artifacts/PDFPack-Windows Artifacts/PDFRenderPack-Windows | Tee-Object -FilePath Artifacts/pdf-compose-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-images.py Artifacts/PDFPack-Windows Artifacts/PDFRenderPack-Windows | Tee-Object -FilePath Artifacts/pdf-images-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-split.py Artifacts/PDFPack-Windows Artifacts/PDFRenderPack-Windows | Tee-Object -FilePath Artifacts/pdf-split-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-document-text.py Artifacts/PDFPack-Windows Artifacts/PDFRenderPack-Windows | Tee-Object -FilePath Artifacts/pdf-document-text-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-pdf-ocr.py Artifacts/PDFPack-Windows Artifacts/PDFRenderPack-Windows Artifacts/pdf-ocr-evaluation/OCRPack | Tee-Object -FilePath Artifacts/pdf-ocr-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain pack and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileform-pdf-windows-x64
          path: |
            Artifacts/PDFPack-Windows/
            Artifacts/pdf-build-windows/*.log
            Artifacts/pdf-smoke-windows.json
            Artifacts/pdf-render-smoke-windows.txt
            Artifacts/pdf-render-engine-windows.txt
            Artifacts/pdf-optimize-windows.txt
            Artifacts/pdf-compose-windows.txt
            Artifacts/pdf-images-windows.txt
            Artifacts/pdf-split-windows.txt
            Artifacts/pdf-document-text-windows.txt
            Artifacts/pdf-ocr-windows.txt
            Artifacts/pdf-ocr-evaluation/*.log
            Artifacts/PDFRenderPack-Windows/
            Artifacts/pdfium-evaluation/attestation-verification.json
            Artifacts/pdfium-evaluation/args.gn
            Artifacts/pdfium-evaluation/VERSION
            Artifacts/pdfium-evaluation/LICENSE
            Artifacts/pdfium-evaluation/licenses/
            Artifacts/pdfium-evaluation/build/Release/
          retention-days: 14
