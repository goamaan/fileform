name: Windows media parity
on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/media-windows.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/media-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Windows build tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make tar xz curl gnupg diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
      - name: Build source-verified media pack
        shell: msys2 {0}
        run: bash crates/fileform-engine/tools/build-media-windows.sh
      - name: Build native CLI and worker
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          $env:RUSTFLAGS='-C target-feature=+crt-static'
          cargo build --release --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real Windows audio transformations
        shell: pwsh
        run: |
          python crates/fileform-engine/tests/smoke-media.py Artifacts/MediaPack-Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain pack, sources and build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileform-media-windows-x64
          path: |
            Artifacts/MediaPack-Windows/
            Artifacts/engine-build-windows/*.log
            Artifacts/engine-build-windows/verification.txt
          retention-days: 14
