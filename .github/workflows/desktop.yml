name: Portable desktop preview
on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'apps/desktop/**', 'Tools/smoke-portable.py', 'Tools/smoke-images.py', 'Tools/smoke-cancellation.py', 'Tools/smoke-source-types.py', 'Tools/check-ci-routing.py', 'Tools/stage-desktop-runtime.py', 'Tools/build-desktop-runtime-mac.py', 'Tools/import-windows-runtime-packs.py', 'native/**', 'Tools/build-ocr-evaluation.py', 'Tools/build-heic-evaluation.py', 'Tools/build-media-pack.sh', 'Tools/build-pdf-pack.sh', 'LICENSE', 'NOTICE', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'apps/desktop/**', 'Tools/smoke-portable.py', 'Tools/smoke-images.py', 'Tools/smoke-cancellation.py', 'Tools/smoke-source-types.py', 'Tools/check-ci-routing.py', 'Tools/stage-desktop-runtime.py', 'Tools/build-desktop-runtime-mac.py', 'Tools/import-windows-runtime-packs.py', 'native/**', 'Tools/build-ocr-evaluation.py', 'Tools/build-heic-evaluation.py', 'Tools/build-media-pack.sh', 'Tools/build-pdf-pack.sh', 'LICENSE', 'NOTICE', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify CI file routing
        run: python Tools/check-ci-routing.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Configure portable toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
          fi
      - name: Verify native engine
        run: cargo test --workspace --locked
      - name: Check native code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build optimized native worker and CLI
        run: cargo build --release --workspace --locked
      - name: Verify worker and CLI processes
        run: python Tools/smoke-portable.py
      - name: Verify native image pixels and rejection paths
        run: python Tools/smoke-images.py
      - name: Verify cooperative cancellation and cleanup
        run: python Tools/smoke-cancellation.py
      - name: Verify supported source file types
        run: python Tools/smoke-source-types.py
      - name: Build complete Mac processing runtime
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          FILEFORM_BUILD_JOBS: '4'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          command -v gpg || brew install gnupg
          command -v ninja || brew install ninja
          python3 Tools/build-desktop-runtime-mac.py --destination Artifacts/DesktopRuntime
      - name: Import and verify complete Windows processing runtime
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python Tools/import-windows-runtime-packs.py --repository $env:GITHUB_REPOSITORY --destination Artifacts/desktop-native-imports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packs = (Get-Content Artifacts/desktop-native-imports/imports.json | ConvertFrom-Json).paths
          python Tools/stage-desktop-runtime.py --worker target/release/fileform-worker.exe --cli target/release/fileform-native.exe --media $packs.'MediaPack-Windows' --pdf $packs.'PDFPack-Windows' --renderer $packs.'PDFRenderPack-Windows' --ocr $packs.OCRPack --heic $packs.'HEICPack-Windows' --destination Artifacts/DesktopRuntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify desktop geometry and export validation
        working-directory: apps/desktop
        run: node --experimental-strip-types --test tests/crop-geometry.test.mjs tests/image-export.test.mjs
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Verify shared desktop native workflows
        working-directory: apps/desktop
        run: node tests/native-workflows.mjs
      - name: Collect distribution notices
        working-directory: apps/desktop
        run: npm run notices
      - name: Package Windows preview
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --x64 --config electron-builder.cjs --publish never
      - name: Package Mac preview
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          npx electron-builder --mac dir --arm64 --config electron-builder.cjs --publish never
          ditto -c -k --keepParent "artifacts/mac-arm64/Fileform Preview.app" "artifacts/Fileform-Preview-mac-arm64.zip"
      - name: Retain preview artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileform-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/artifacts/*.exe
            apps/desktop/artifacts/*.zip
            Artifacts/Verification/portable-smoke.json
            Artifacts/Verification/portable-cancellation.json
            Artifacts/Verification/portable-images.json
            Artifacts/DesktopRuntime/runtime.json
            Artifacts/desktop-native-imports/imports.json
          retention-days: 14
