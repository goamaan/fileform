name: Windows OCR evaluation
on:
  push:
    branches: [main]
    paths: ['Tools/build-ocr-evaluation.py', 'crates/fileform-engine/tests/smoke-ocr-evaluation.py', 'crates/fileform-engine/tests/fixtures/ocr-page.ppm.gz', '.github/workflows/ocr-windows.yml']
  pull_request:
    paths: ['Tools/build-ocr-evaluation.py', 'crates/fileform-engine/tests/smoke-ocr-evaluation.py', 'crates/fileform-engine/tests/fixtures/ocr-page.ppm.gz', '.github/workflows/ocr-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocr-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ocr:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned OCR sources and models
        shell: pwsh
        run: |
          python Tools/build-ocr-evaluation.py --work Artifacts/ocr-windows --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Recognize the controlled raster fixture
        shell: pwsh
        run: |
          python crates/fileform-engine/tests/smoke-ocr-evaluation.py Artifacts/ocr-windows/OCRPack | Tee-Object -FilePath Artifacts/ocr-windows/smoke.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain evaluation pack and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileform-ocr-evaluation-windows-x64
          path: |
            Artifacts/ocr-windows/OCRPack/
            Artifacts/ocr-windows/*.log
            Artifacts/ocr-windows/commands.json
            Artifacts/ocr-windows/smoke.txt
          retention-days: 14
