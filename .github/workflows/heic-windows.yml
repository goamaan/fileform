name: Windows HEIC dependency evaluation
on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', 'Tools/build-heic-evaluation.py', 'native/heic-decode/**', '.github/workflows/heic-windows.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', 'Tools/build-heic-evaluation.py', 'native/heic-decode/**', '.github/workflows/heic-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heic-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependencies:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned HEIC decoder dependencies
        shell: pwsh
        run: |
          python Tools/build-heic-evaluation.py --work Artifacts/heic-dependency-evaluation --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise isolated HEIC helper
        shell: pwsh
        run: |
          $prefix = (Resolve-Path Artifacts/heic-dependency-evaluation/install).Path
          cmake -S native/heic-decode -B Artifacts/heic-helper-evaluation -A x64 "-DHEIC_ROOT=$prefix" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build Artifacts/heic-helper-evaluation --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/heic-decode/smoke.py Artifacts/heic-helper-evaluation/Release/fileform-heic-decode.exe native/heic-decode/fixtures | Tee-Object -FilePath Artifacts/heic-helper-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise Rust HEIC adapter
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          $env:RUSTFLAGS='-C target-feature=+crt-static'
          cargo build --release --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/heic-decode/stage-evaluation.py Artifacts/heic-helper-evaluation/Release Artifacts/heic-dependency-evaluation Artifacts/HEICPack-Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-heic-containers.py Artifacts/HEICPack-Windows | Tee-Object -FilePath Artifacts/heic-containers-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python crates/fileform-engine/tests/smoke-heic.py Artifacts/HEICPack-Windows | Tee-Object -FilePath Artifacts/heic-engine-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain source build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileform-heic-dependency-evaluation-windows-x64
          path: |
            Artifacts/heic-dependency-evaluation/*.log
            Artifacts/heic-dependency-evaluation/*.json
            Artifacts/heic-dependency-evaluation/*-cache.txt
            Artifacts/heic-dependency-evaluation/*.tar.gz
            Artifacts/heic-dependency-evaluation/licenses/
            Artifacts/heic-dependency-evaluation/install/
            Artifacts/heic-helper-evaluation/Release/
            Artifacts/heic-helper-windows.txt
            Artifacts/heic-engine-windows.txt
            Artifacts/heic-containers-windows.txt
            Artifacts/HEICPack-Windows/
          retention-days: 14
