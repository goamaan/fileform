[package]
name = "fileform-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crc32fast = "=1.5.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
moxcms = "=0.8.1"
png = "=0.18.1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tiff = { version = "=0.11.3", default-features = false, features = ["lzw"] }
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
